[project]
name = "finagentic"
version = "0.1.0"
description = "FinAgentic using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.13.0",
]

[project.scripts]
finagentic = "finagentic.main:run"
run_crew = "finagentic.main:run"
train = "finagentic.main:train"
replay = "finagentic.main:replay"
test = "finagentic.main:test"
run_with_trigger = "finagentic.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
