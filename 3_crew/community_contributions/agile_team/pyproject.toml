[project]
name = "agile_team"
version = "0.1.0"
description = "agile_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.13.0"
]

[project.scripts]
agile_team = "agile_team.main:run"
run_crew = "agile_team.main:run"
train = "agile_team.main:train"
replay = "agile_team.main:replay"
test = "agile_team.main:test"
run_with_trigger = "agile_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
