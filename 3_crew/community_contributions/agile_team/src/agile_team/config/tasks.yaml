requirement_definition:
  description: >
    Analizar las necesidades del cliente y transformarlas en especificaciones técnicas detalladas.
    Debes definir los requerimientos funcionales y no funcionales, crear historias de usuario
    y establecer los criterios de aceptación para el producto.
    IMPORTANTE: Eres la ÚNICA fuente de verdad sobre los requerimientos. Tu PRD es el documento
    base obligatorio para que el resto del equipo pueda trabajar.
    Utiliza la herramienta de escritura de archivos para guardar el PRD final en formato Markdown estrictamente legible en el archivo especificado, evitando formatos JSON.
    Aquí los requisitos iniciales: {initial_requirements}
  expected_output: >
    Un documento de requerimientos del producto (PRD) detallado con historias de usuario y criterios de aceptación en formato Markdown.
  agent: product_owner
  output_file: output_manager/product_requirements.md



technical_architecture:
  description: >
    Diseñar la arquitectura técnica del sistema basándose en los requerimientos definidos.
    Define el modelo de datos, la estructura de la API, los patrones de diseño a utilizar
    y la estrategia de despliegue. Justifica tus decisiones técnicas y asegúrate de que la arquitectura sea escalable, segura y eficiente.
    ESTA TAREA REQUIERE OBLIGATORIAMENTE EL PRD GENERADO POR EL PRODUCT OWNER.
    Si no existe un PRD detallado, el Tech Lead debe rechazar la tarea y solicitar la definición al Product Owner.
    IMPORTANTE: Utiliza la herramienta de escritura de archivos para guardar el diseño final en formato Markdown estrictamente legible en el archivo especificado, evitando formatos JSON.
  expected_output: >
    Un documento de diseño arquitectónico técnico en formato Markdown que incluya el diagrama de entidad-relación,
    especificaciones de endpoints de la API y justificación de las decisiones técnicas.
  agent: tech_lead
  output_file: output_manager/technical_architecture.md



backend_development:
  description: >
    Implementar la lógica del servidor, la base de datos y las APIs según la arquitectura definida.
    Asegura que el código sea escalable, eficiente y siga las mejores prácticas de desarrollo en Python.
    TODO EL DESARROLLO DEBE SER PRECEDIDO POR LA VALIDACIÓN DE LA ARQUITECTURA POR PARTE DEL TECH LEAD.
    PROHIBIDO el uso de placeholders, comentarios de 'implementar aquí' o simulaciones.
    Debes escribir el CÓDIGO COMPLETO y la lógica real en ficheros .py ejecutables utilizando la FileWriterTool.
    Guarda los ficheros .py en el directorio output/implementation/backend/.
  expected_output: >
    Código fuente del backend REAL y FUNCIONAL implementado en ficheros .py ejecutables. El resultado debe ser código ejecutable, no una descripción.
  agent: backend_engineer
  output_file: output_coder/{module_name}
  context:
    - technical_architecture
    - requirement_definition



frontend_development:
  description: >
    Desarrollar la interfaz de usuario basada en los requerimientos y la arquitectura técnica.
    Implementa una UI intuitiva, responsive y conectada a las APIs del backend,
    enfocándote en la experiencia de usuario (UX) y la performance.
    PROHIBIDO el uso de placeholders o simulaciones. Debes escribir el código completo de la interfaz
    utilizando frameworks de Python (como Streamlit o Reflex) en ficheros .py ejecutables y guardándolos con la FileWriterTool.
    Guarda los ficheros .py en el directorio output/implementation/frontend/.
  expected_output: >
    Código fuente del frontend REAL y FUNCIONAL implementado en ficheros .py ejecutables. El resultado debe ser código ejecutable, no una descripción.
  agent: frontend_engineer
  output_file: output_coder/{interface_name}
  context:
    - technical_architecture
    - requirement_definition
    - backend_development


security_audit:
  description: >
    Realizar una auditoría de seguridad exhaustiva sobre el código generado por el equipo de desarrollo.
    Identifica vulnerabilidades según los estándares de OWASP, verifica la gestión de autenticación
    y propone medidas de mitigación para cualquier riesgo encontrado.
    Debes proporcionar scripts de prueba de seguridad o scanners automatizados implementados en ficheros .py ejecutables.
    Guarda los ficheros .py en el directorio output/implementation/security/.
  expected_output: >
    Un informe detallado de auditoría de seguridad en formato Markdown detallando las vulnerabilidades encontradas,
    su nivel de criticidad y las recomendaciones precisas para su corrección, acompañado de los scripts de validación en ficheros .py.
  agent: security_engineer
  output_file: output_coder/vulnerability_report.md
  context:
    - backend_development
    - frontend_development

quality_assurance:
  description: >
    Planificar y ejecutar pruebas exhaustivas (unitarias, integración y end-to-end) para asegurar la calidad del software.
    Tu misión principal es VALIDAR que el código entregado es real y ejecutable.
    Debes leer los archivos generados por el backend y frontend. Si encuentras placeholders, comentarios de 'simulación' o archivos vacíos, la tarea debe marcarse como FALLIDA y reportar que el desarrollo es insuficiente.
    Todas las suites de prueba deben implementarse en ficheros .py ejecutables (usando pytest o unittest) y guardarse con la FileWriterTool.
    Guarda los ficheros .py en el directorio output/implementation/tests/.
  expected_output: >
    Suites de pruebas reales que validen la funcionalidad del software. Si el software es simulado, el output debe ser un informe de fallo crítico exigiendo código real.
  agent: qa_engineer
  output_file: output_coder/test_{module_name}
  context:
    - backend_development
    - frontend_development


sprint_review:
  description: >
    Coordinar el cierre del ciclo de desarrollo, validar que no queden impedimentos críticos
    y resumir los logros del equipo durante el sprint. Asegura que el incremento de software
    esté listo para ser entregado.
  expected_output: >
    Un resumen ejecutivo del sprint en formato Markdown que incluya el estado final del incremento de software,
    el cumplimiento de los objetivos y una retrospectiva breve sobre la eficiencia del proceso.
  agent: scrum_master
  output_file: output_manager/sprint_review.md
  context:
    - requirement_definition
    - quality_assurance
    - security_audit
